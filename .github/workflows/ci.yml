name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      # setup-homebrew already registers this repo as a tap, but pointed at the
      # pushed branch on GitHub - which on a pull request is not the code under
      # review. Replace it with the checkout so brew reads exactly these files.
      - name: Point the tap at the checkout
        run: |
          tap_dir="$(brew --repository)/Library/Taps/viethoavnm/homebrew-librekey"
          rm -rf "$tap_dir"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

      # Homebrew 6 refuses to load casks from a tap outside the official ones
      # until it is trusted. Older Homebrew has no `brew trust` at all.
      - name: Trust the tap
        run: |
          if brew help trust >/dev/null 2>&1; then
            brew trust viethoavnm/librekey
          else
            echo "Homebrew ở runner chưa có brew trust, bỏ qua."
          fi

      - name: Style
        run: brew style viethoavnm/librekey

      # --online fetches the URL, which catches a sha256 that no longer matches
      # the release asset - the failure mode the bump workflow could produce.
      - name: Audit
        run: brew audit --cask --online viethoavnm/librekey/librekey
